[package]
name = "mixenc"
description = "Lets clangd and AI agents read a C/C++ repository whose files mix Shift_JIS (CP932), UTF-8 and other encodings, through a UTF-8 mirror"
version = "0.1.0"
edition = "2024"
# std::fs::File::lock (the mirror's lock) is stable since 1.89.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/6r1ntry52o/mixenc"
readme = "README.md"
keywords = ["clangd", "shift-jis", "cp932", "encoding", "mirror"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
encoding_rs = "0.8"
notify = "8"
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[build-dependencies]
embed-manifest = "1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
