# cargo-about: the licenses of the crates compiled into mixenc.exe (THIRD_PARTY_LICENSES.html in
# each release archive). The release workflow fails when a crate uses a license not listed here.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "CC0-1.0", "ISC", "Unicode-3.0", "Unlicense", "Zlib"]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
