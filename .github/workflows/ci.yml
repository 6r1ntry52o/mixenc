name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: clangd
        # LLVM comes with the runner image; the entry's end-to-end tests start its clangd.
        shell: pwsh
        run: '& "C:\Program Files\LLVM\bin\clangd.exe" --version'

      - name: Tests
        # The samples include a path of about 950 characters.
        env:
          MIXENC_REQUIRE_CLANGD: "1"
          MIXENC_TEST_CLANGD: C:\Program Files\LLVM\bin\clangd.exe
        run: |
          git config --global core.longpaths true
          cargo test --locked --no-fail-fast

  vscode:
    name: VS Code extension
    runs-on: windows-2022
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: mixenc (the extension runs it)
        working-directory: .
        run: cargo build --release --locked

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Package
        run: npx vsce package --no-dependencies

      - name: In VS Code
        # Downloads VS Code (stable) and runs the extension on a sample workspace.
        run: npm run test:vscode

  msrv:
    name: minimum Rust version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Rust 1.89
        run: |
          rustup toolchain install 1.89 --profile minimal --no-self-update
          rustup default 1.89
      - run: cargo check --locked
